services:
  # Backend API Service
  - type: web
    name: pravah-api
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn pravah.api.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

  # Frontend Streamlit Service
  - type: web
    name: pravah-ui
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "streamlit run app.py --server.port $PORT --server.address 0.0.0.0"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PRAVAH_API_URL
        fromService:
          type: web
          name: pravah-api
          property: url
